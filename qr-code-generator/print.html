<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<meta name="robots" content="noindex">

<title>Print QR Code | WebHustle Tools</title>


<style>

* {
    box-sizing: border-box;
}


body {

    margin: 0;

    font-family: Arial, Helvetica, sans-serif;

    background: #f3f4f6;

    color: #1f2937;

    padding: 50px 20px;

}


/* =====================================
   WebHustle Branding
====================================== */

.print-brand {

    text-align: center;

    font-size: 22px;

    font-weight: bold;

    color: #1f2937;

    margin-bottom: 25px;

}


/* =====================================
   Preview Container
====================================== */

.print-container {

    max-width: 600px;

    margin: 0 auto;

    background: white;

    padding: 40px;

    border-radius: 18px;

    box-shadow: 0 10px 30px rgba(0,0,0,.08);

}


h1 {

    text-align: center;

    margin: 0 0 10px;

}


p {

    text-align: center;

    color: #6b7280;

    margin-bottom: 30px;

}


/* =====================================
   QR Code
====================================== */

#qrPrint {

    width: 220px;

    height: 220px;

    display: block;

    margin: 0 auto 30px;

}


/* =====================================
   Print Button
====================================== */

.print-button {

    display: block;

    width: 100%;

    padding: 15px;

    background: #2563eb;

    color: white;

    border: none;

    border-radius: 12px;

    font-size: 18px;

    cursor: pointer;

}


.print-button:hover {

    background: #1d4ed8;

}


/* =====================================
   Back Button
====================================== */

.back-button {

    display: block;

    margin-top: 15px;

    text-align: center;

    color: #2563eb;

    text-decoration: none;

    font-size: 15px;

}


/* =====================================
   PRINT
====================================== */

@media print {

    @page {

        margin: 0;

    }


    html,
    body {

        width: 100%;

        height: 100%;

        margin: 0;

        padding: 0;

        background: white;

    }


    body {

        display: flex;

        justify-content: center;

        align-items: center;

    }


    /* Hide EVERYTHING except QR code */

    .print-brand,
    h1,
    p,
    .print-button,
    .back-button {

        display: none !important;

    }


    .print-container {

        width: 100%;

        height: 100%;

        max-width: none;

        margin: 0;

        padding: 0;

        background: white;

        box-shadow: none;

        border-radius: 0;

        display: flex;

        justify-content: center;

        align-items: center;

    }


    #qrPrint {

        width: 220px;

        height: 220px;

        margin: 0;

    }

}

</style>

</head>


<body>


<div class="print-brand">

    WebHustle Tools

</div>


<div class="print-container">


    <h1>
        Print QR Code
    </h1>


    <p>
        Your QR code is ready to print.
    </p>


    <img
        id="qrPrint"
        alt="QR Code">


    <button
        class="print-button"
        onclick="window.print()">

        Print QR Code

    </button>


    <a
        href="index.html"
        class="back-button">

        ← Back to QR Code Generator

    </a>


</div>


<script>

const qrImage =
    localStorage.getItem("qrCodeToPrint");


if (qrImage) {

    document.getElementById("qrPrint").src =
        qrImage;

}

else {

    document.querySelector(".print-container").innerHTML = `

        <h1>No QR Code Found</h1>

        <p>
            Please generate a QR code first.
        </p>

        <a
            href="index.html"
            class="back-button">

            ← Back to QR Code Generator

        </a>

    `;

}

</script>


</body>

</html>
