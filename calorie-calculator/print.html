<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Calorie Results | WebHustle Tools</title>


<style>

body{

    font-family:Arial,Helvetica,sans-serif;

    background:#f3f4f6;

    color:#1f2937;

}


.container{

    max-width:600px;

    margin:50px auto;

    background:white;

    padding:40px;

    border-radius:18px;

    box-shadow:0 10px 30px rgba(0,0,0,.08);

}


h1{

    text-align:center;

    margin-bottom:30px;

}


.result{

    background:#eff6ff;

    border-left:5px solid #2563eb;

    padding:20px;

    border-radius:12px;

}


.card{

    margin-bottom:25px;

}


.card h2{

    color:#2563eb;

    font-size:20px;

    margin-bottom:8px;

}


.card p{

    font-size:28px;

    font-weight:bold;

}


button{

    margin-top:25px;

    width:100%;

    padding:15px;

    background:#2563eb;

    color:white;

    border:none;

    border-radius:12px;

    font-size:18px;

    cursor:pointer;

}


@media print{

    button{

        display:none;

    }

}


</style>


</head>


<body>


<div class="container">


<h1>
Calorie Results
</h1>



<div class="result">


<div class="card">

<h2>
Maintain Weight
</h2>

<p id="maintain">
—
</p>

</div>



<div class="card">

<h2>
Mild Weight Loss
</h2>

<p id="mild">
—
</p>

</div>



<div class="card">

<h2>
Weight Loss
</h2>

<p id="loss">
—
</p>

</div>



<div class="card">

<h2>
Extreme Weight Loss
</h2>

<p id="extreme">
—
</p>

</div>


</div>



<button onclick="window.print()">

Print

</button>



</div>



<script>


const results =
JSON.parse(localStorage.getItem("calorieResults"));



if(results){


document.getElementById("maintain").textContent =
results.maintain;


document.getElementById("mild").textContent =
results.mild;


document.getElementById("loss").textContent =
results.loss;


document.getElementById("extreme").textContent =
results.extreme;


}



</script>


</body>

</html>
