<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Free Lorem Ipsum Generator - WebHustle Tools</title>

    <meta name="description" content="Generate free Lorem Ipsum placeholder text for websites, designs, presentations, and projects. Copy random placeholder paragraphs instantly.">

    <link rel="stylesheet" href="style.css">

</head>


<body>

<!-- =====================================
     Navigation
====================================== -->

<nav>

    <div class="logo">
        <a href="../index.html">
            WebHustle Tools
        </a>
    </div>


    <div class="nav-links">

        <a href="../index.html">
            Home
        </a>

        <a href="../index.html#tools">
            Tools
        </a>

    </div>

</nav>



<main>

<div class="tool-container">

    <h2>Lorem Ipsum Generator</h2>


    <p class="description">
        Generate realistic placeholder text for websites,
        designs, presentations, and projects.
    </p>



    <div class="controls">


        <label for="amount">
            Paragraphs:
        </label>


        <input 
            type="number" 
            id="amount" 
            value="3"
            min="1"
            max="10"
        >


        <button onclick="generateLorem()">
            Generate Text
        </button>


    </div>



    <textarea id="output" readonly></textarea>



    <div class="buttons">


        <button onclick="copyText()">
            Copy
        </button>


        <button onclick="clearText()" class="secondary">
            Clear
        </button>


    </div>



</div>

</main>



<footer>

    <p>
        © 2026 WebHustle Tools
    </p>

</footer>
